[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "retrieval-under-stress"
version = "0.1.0"
description = "A reproducible investigation of retrieval under query noise"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rank-bm25==0.2.2",
    "sentence-transformers>=6.1.0",
    "huggingface-hub>=1.32.0",
    "numpy>=2.4.6",
    "qdrant-client==1.18.0",
    "matplotlib>=3.11.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
retrieval-lab = "retrieval_lab.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring an external service",
]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I"]
