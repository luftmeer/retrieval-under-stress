[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "retrieval-under-stress"
version = "0.1.0"
description = "A reproducible investigation of retrieval under query noise"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
retrieval-lab = "retrieval_lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I"]