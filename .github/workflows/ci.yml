name: CI

on: [push, pull_request]

permissions:
 contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Check application
        run: uv run --locked retrieval-lab doctor


  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build API image
        run: |
          docker build \
            --file Dockerfile.api \
            --tag retrieval-under-stress-api:ci \
            .

      - name: Check API package inside image
        run: |
          docker run \
            --rm \
            retrieval-under-stress-api:ci \
            python -c \
            "from retrieval_lab.api.app import app; print(app.title)"

      - name: Build frontend image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag retrieval-under-stress-frontend:ci \
            .

      - name: Check frontend installation
        run: |
          docker run \
            --rm \
            retrieval-under-stress-frontend:ci \
            python -c \
            "import streamlit; print(streamlit.__version__)"