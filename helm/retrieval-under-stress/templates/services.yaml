{{- range $name, $port := dict "api" 8000 "frontend" 8501 "qdrant" 6333 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http